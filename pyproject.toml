[project]
name = "tone-encoding-in-speech-model"
version = "0.1.0"
description = "Code for the NAACL 2024 paper \"Encoding of lexical tone in self-supervised models of spoken language\""
readme = "README.md"
# fairseq 0.12.2 fails to import on Python >= 3.11: its dataclasses use a
# mutable class default, which Python 3.11 rejects at class definition time
# ("ValueError: mutable default <class ...CommonConfig> for field common is
# not allowed: use default_factory"). Python 3.10 is the validated version.
requires-python = ">=3.10,<3.11"
dependencies = [
    "fairseq==0.12.2",
    "ipython==8.17.2",
    "joblib==1.3.2",
    "librosa==0.10.1",
    "matplotlib==3.8.1",
    "numpy==1.26.1",
    "pandas==2.1.2",
    "praat-parselmouth>=0.4.0",
    "praat-textgrids>=1.4.0",
    "plotnine==0.12.3",
    "pypinyin==0.49.0",
    "scikit-learn==1.3.2",
    "scipy==1.11.4",
    "seaborn==0.13.0",
    "tqdm==4.66.1",
    "transformers==4.40.0",
    # Build-time requirements for the fairseq sdist (see no-build-isolation).
    "cython<3",
    "setuptools",
    "wheel",
]

# PyTorch is provided through the extras below. Select exactly one extra
# matching your accelerator: `uv sync --extra cpu` or `uv sync --extra cu121`.
# This repository was validated with the cu121 build.
[project.optional-dependencies]
cpu = [
    "torch==2.1.2",
    "torchaudio==2.1.2",
]
cu121 = [
    "torch==2.1.2",
    "torchaudio==2.1.2",
]

# Research scripts, not a distributable package: `uv sync` creates a working
# environment without building/installing this repo.
[tool.uv]
package = false
# fairseq 0.12.2 must build against the environment's Cython<3, so build it
# without isolation.
no-build-isolation-package = ["fairseq"]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cu121" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu121", extra = "cu121" },
]
torchaudio = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu121", extra = "cu121" },
]
# The PyPI sdist of fairseq 0.12.2 omits fairseq/clib/libbase/ and cannot
# build from source. Use the complete GitHub tag tarball instead.
fairseq = { url = "https://github.com/facebookresearch/fairseq/archive/refs/tags/v0.12.2.tar.gz" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
