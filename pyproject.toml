[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tone-encoding-in-speech-model"
version = "0.1.0"
description = "Code for the NAACL 2024 paper \"Encoding of lexical tone in self-supervised models of spoken language\""
readme = "README.md"
# Python 3.10, 3.11, and 3.12 are supported. torch 2.5.1 ships cp310-cp312
# wheels, and every pinned dependency has cp312 wheels.
requires-python = ">=3.10,<3.13"
dependencies = [
    "ipython==8.17.2",
    "joblib==1.3.2",
    "librosa==0.10.1",
    "matplotlib==3.8.1",
    "numpy==1.26.4",
    "pandas==2.1.2",
    "praat-parselmouth>=0.4.0",
    "praat-textgrids>=1.4.0",
    "plotnine==0.12.3",
    "pypinyin==0.49.0",
    "scikit-learn==1.3.2",
    "scipy==1.11.4",
    "seaborn==0.13.0",
    # librosa 0.10.1 imports pkg_resources at import time. setuptools 82 removed
    # that module, so cap the provider below 82.
    "setuptools<82",
    "tqdm==4.66.1",
    "transformers==4.46.3",
]

# PyTorch is provided through the extras below. Select exactly one extra
# matching your accelerator: `uv sync --extra cpu` or `uv sync --extra cu121`.
# This repository was validated with the cu121 build.
[project.optional-dependencies]
cpu = [
    "torch==2.5.1",
    "torchaudio==2.5.1",
]
cu121 = [
    "torch==2.5.1",
    "torchaudio==2.5.1",
]

# Install the src-layout package editable into the environment, so both
# `python -m tone_encoding.X` and `from tone_encoding import X` work after
# `uv sync`.
[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cu121" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu121", extra = "cu121" },
]
torchaudio = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu121", extra = "cu121" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
